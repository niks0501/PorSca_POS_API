name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy manually selected revision over SSH
        shell: bash
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST_KEY: ${{ vars.STAGING_HOST_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)" >/dev/null
          KNOWN_HOSTS="$(mktemp)"
          trap 'rm -f "$KNOWN_HOSTS"; ssh-agent -k >/dev/null' EXIT
          if ! printf '%s\n' "$STAGING_SSH_KEY" | ssh-add - >/dev/null 2>&1; then
            echo "ssh-add could not load STAGING_SSH_KEY (not a valid unencrypted private key?)" >&2
            exit 1
          fi
          unset STAGING_SSH_KEY
          if [ -z "$STAGING_HOST_KEY" ] || [[ "$STAGING_HOST_KEY" == *$'\n'* ]]; then
            echo "STAGING_HOST_KEY must contain exactly one known-hosts line" >&2
            exit 1
          fi
          printf '%s\n' "$STAGING_HOST_KEY" >"$KNOWN_HOSTS"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS" \
            "$STAGING_USER@$STAGING_HOST" bash -s -- "$DEPLOY_SHA" <<'DEPLOY'
          set -euo pipefail
          cd "$HOME/porsca-api"
          git fetch origin staging --quiet
          # Do not roll back staging when a queued/manual run has become stale.
          test "$(git rev-parse FETCH_HEAD)" = "$1"
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "Refusing to reset a dirty staging checkout" >&2
            exit 1
          fi
          PREVIOUS_SHA="$(git rev-parse HEAD)"
          echo "Rollback notice: previous deployed SHA was $PREVIOUS_SHA"
          git reset --hard "$1" >/dev/null
          # Restore PHP-FPM write access after reset (deploy owns tracked files).
          for path in storage bootstrap/cache; do
            if [ -d "$path" ]; then
              chgrp -R www-data "$path"
              chmod -R g+rwX "$path"
            fi
          done
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          php artisan config:clear
          php artisan down
          trap 'php artisan up' EXIT
          php artisan migrate --force
          php artisan up
          trap - EXIT
          # Record before caching so HTTP workers see the deployed SHA.
          php -r '$p=".env"; $s=file_get_contents($p); $s=preg_replace("/^APP_COMMIT=.*\\R?/m", "", $s); file_put_contents($p, rtrim($s)."\nAPP_COMMIT=".$argv[1]."\n");' "$1"
          php artisan config:cache
          # APP_URL is host-owned configuration; no further Actions secrets needed.
          php -r '
          require "vendor/autoload.php";
          $app = require "bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $url = rtrim(config("app.url"), "/")."/api/v1/health";
          if (parse_url($url, PHP_URL_SCHEME) !== "https") { exit(1); }
          $response = Illuminate\Support\Facades\Http::timeout(30)->get($url);
          if (!$response->successful() || $response->json("data.status") !== "ok"
              || $response->json("data.commit") !== $argv[1]) { exit(1); }
          ' "$1"
          DEPLOY
