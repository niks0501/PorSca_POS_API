
pr:
  base_branch: development

ignore_patterns:
  - "graphify-out/**"

protected_paths:
  - ".no-mistakes.yaml"
  - "database/migrations/**"
  - ".github/workflows/**"

review:
  conversation: false
  path_instructions:
    - path: "app/Services/**"
      instructions: "Check atomic sale/stock settlement, reservation release, webhook replay, and checkout idempotency."
    - path: "app/Domain/**"
      instructions: "Preserve centavo arithmetic, evidence-based finality, and checkout/fulfillment locks."
    - path: "app/Http/**"
      instructions: "Check actor authorization, input validation, and docs/CHECKOUT-CONTRACT.md response semantics."
    - path: "database/migrations/**"
      instructions: "Preserve existing data and idempotency uniqueness; check forward compatibility and rollback safety."
commands:
  test: "vendor/bin/phpunit tests/Unit/CheckoutRulesTest.php --fail-on-empty-test-suite"
test:
  instructions: |
    Read AGENTS.md and PROJECT_CHECKS.md; confirm the selected checkout contract before live requests.
    Follow docs/SETUP.md to start an isolated local API on a free port with a verified disposable database and synthetic users.
    Use chrome-devtools-axi, a unique CHROME_DEVTOOLS_AXI_SESSION, and default isolated Chrome for changed HTTP scenarios.
    Inspect status/body and persisted sale/stock effects; obey PROJECT_CHECKS.md safety and proof rules, never real payments or external webhooks.
    Report defects as no-go and unavailable checks as inconclusive with evidence/manual steps; stop only run-owned resources.
